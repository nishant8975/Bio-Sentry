<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1c3028"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="65" y="70" fill="#eafff0" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">BioSentry — Hardware Stack</text>
  <text x="65" y="105" fill="#9ecbb0" font-family="Inter,Arial,sans-serif" font-size="18">Recommended/current project components</text>

  <g filter="url(#s)"><rect x="70" y="165" width="500" height="230" rx="24" fill="#153222" stroke="#5db77b" stroke-width="2"/>
    <text x="105" y="210" fill="#eafff0" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Head / Sensing Node</text>
    <text x="105" y="250" fill="#bfe4cb" font-family="Inter,Arial,sans-serif" font-size="18">• Raspberry Pi 4B</text>
    <text x="105" y="283" fill="#bfe4cb" font-family="Inter,Arial,sans-serif" font-size="18">• Camera for edge vision</text>
    <text x="105" y="316" fill="#bfe4cb" font-family="Inter,Arial,sans-serif" font-size="18">• Sipeed 6+1 microphone array</text>
    <text x="105" y="349" fill="#bfe4cb" font-family="Inter,Arial,sans-serif" font-size="18">• SX1262/SX127x LoRa interface</text>
    <text x="105" y="382" fill="#bfe4cb" font-family="Inter,Arial,sans-serif" font-size="18">• Local AI + audio processing</text>
  </g>

  <g filter="url(#s)"><rect x="630" y="165" width="500" height="230" rx="24" fill="#143242" stroke="#5eb7d3" stroke-width="2"/>
    <text x="665" y="210" fill="#e8fbff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Relay / Gateway</text>
    <text x="665" y="250" fill="#badfe8" font-family="Inter,Arial,sans-serif" font-size="18">• Raspberry Pi 3B+</text>
    <text x="665" y="283" fill="#badfe8" font-family="Inter,Arial,sans-serif" font-size="18">• Waveshare SX1262 LoRa HAT</text>
    <text x="665" y="316" fill="#badfe8" font-family="Inter,Arial,sans-serif" font-size="18">• UART / USB serial interface</text>
    <text x="665" y="349" fill="#badfe8" font-family="Inter,Arial,sans-serif" font-size="18">• Local API + dashboard server</text>
    <text x="665" y="382" fill="#badfe8" font-family="Inter,Arial,sans-serif" font-size="18">• Lightweight event storage</text>
  </g>

  <g filter="url(#s)"><rect x="160" y="470" width="880" height="205" rx="24" fill="#111d19" stroke="#42664f"/>
    <text x="200" y="515" fill="#d7f6df" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Communication + Power Notes</text>
    <text x="200" y="553" fill="#9ecbb0" font-family="Inter,Arial,sans-serif" font-size="17">• LoRa link is used for small, structured metadata — not images.</text>
    <text x="200" y="584" fill="#9ecbb0" font-family="Inter,Arial,sans-serif" font-size="17">• 868 MHz is the current target band for the SX1262-based setup.</text>
    <text x="200" y="615" fill="#9ecbb0" font-family="Inter,Arial,sans-serif" font-size="17">• Keep power, antenna placement, weather protection, and grounding specific to the deployment.</text>
    <text x="200" y="646" fill="#9ecbb0" font-family="Inter,Arial,sans-serif" font-size="17">• Final pin mappings should match the exact board revision used in the field.</text>
  </g>
</svg>
